name: Build NifSkopeCS release

# Run by hand (Actions > Build NifSkopeCS release > Run workflow). Builds the packages from the selected branch and
# creates a draft release named after build/VERSION_CS, with release notes generated by GitHub. The release stays a
# draft: publishing it on GitHub creates its tag, on the commit that was built.
on:
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time, so that two runs cannot create drafts for the same version
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    name: Read version
    outputs:
      version: ${{ steps.version.outputs.version }}
      nifskope_version: ${{ steps.version.outputs.nifskope_version }}

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # Fails before anything is built if the version was not bumped since the last release (or draft)
    - name: 'Read build/VERSION_CS'
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="$(tr -d '[:space:]' < build/VERSION_CS)"
        nifskope_version="$(tr -d '[:space:]' < build/VERSION)"
        if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error file=build/VERSION_CS::The version must look like 0.1 or 1.2.3, not '$version'."
          exit 1
        fi
        if git rev-parse --quiet --verify "refs/tags/$version" > /dev/null; then
          echo "::error file=build/VERSION_CS::Tag $version already exists: bump build/VERSION_CS before releasing."
          exit 1
        fi
        # Drafts have no tag yet, so look for them among the releases
        if gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' | grep -qxF "$version"; then
          echo "::error file=build/VERSION_CS::A release or draft for $version already exists: bump build/VERSION_CS, or delete that draft."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "nifskope_version=$nifskope_version" >> "$GITHUB_OUTPUT"
        echo "Releasing NifSkopeCS $version (based on NifSkope $nifskope_version)"


  build_windows:
    needs: version
    runs-on: windows-latest
    name: Build MSYS2
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: 'Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        cache: true
        install: 'base-devel mingw-w64-ucrt-x86_64-gcc msys/p7zip mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-imageformats mingw-w64-ucrt-x86_64-qt6-tools msys/wget'

    - name: 'Build with qmake'
      shell: msys2 {0}
      run: |
        qmake6 noavx=1 NifSkope.pro
        make -j 8
        mv -f release/NifSkopeCS.exe release/NifSkopeCS_noavx.exe
        make clean
        qmake6 noavx2=1 NifSkope.pro
        make -j 8
        mv -f release/NifSkopeCS.exe release/NifSkopeCS_noavx2.exe
        make clean
        qmake6 NifSkope.pro
        make -j 8
        wget https://github.com/fo76utils/CoACD/releases/download/1.0.7-20251215/CoACD-20251215-win64.7z
        7za x CoACD-20251215-win64.7z
        wget https://github.com/fo76utils/NifMopp/releases/download/1.0/NifMopp.zip
        7za x NifMopp.zip
        mv -f lib_coacd.dll LICENSE.CoACD NifMopp.exe release
        mv -f release NifSkopeCS
        7za a -m0=lzma -mx=9 NifSkopeCS-${VERSION}-win64qt6_gcc.7z NifSkopeCS

    - name: 'Upload Artifacts'
      uses: actions/upload-artifact@v6
      with:
        name: build-win
        path: |
          NifSkopeCS-*.7z


  build_linux:
    needs: version
    runs-on: 'ubuntu-24.04'
    name: Build Linux
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: 'Install required packages'
      run: |
        sudo apt-get update
        sudo apt-get -y install libsdl2-dev qt6-base-dev qt6-base-private-dev qt6-base-dev-tools qmake6 qt6-image-formats-plugins 7zip

    - name: 'Build with qmake'
      run: |
        qmake6 noavx=1 NifSkope.pro
        make -j 8
        mv -f release/NifSkopeCS release/NifSkopeCS_noavx
        make clean
        qmake6 noavx2=1 NifSkope.pro
        make -j 8
        mv -f release/NifSkopeCS release/NifSkopeCS_noavx2
        make clean
        qmake6 NifSkope.pro
        make -j 8
        chmod -f 0755 release release/NifSkopeCS release/NifSkopeCS_noavx release/NifSkopeCS_noavx2
        curl --location -O https://github.com/SarahWeiii/CoACD/releases/download/1.0.7/coacd-1.0.7-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
        7za x coacd-1.0.7-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
        curl --location -O https://github.com/fo76utils/NifMopp/releases/download/1.0/NifMopp.zip
        7za x NifMopp.zip
        chmod 0755 NifMopp.exe
        mkdir release/coacd
        mv -f coacd/lib_coacd.so coacd-1.0.7.dist-info/LICENSE release/coacd
        mv -f coacd.libs NifMopp.exe release
        mv -f release nifskopecs-linux
        7za a -m0=lzma -mx=9 NifSkopeCS-${VERSION}-linuxqt6_x64.7z nifskopecs-linux

    - name: 'Upload Artifacts'
      uses: actions/upload-artifact@v6
      with:
        name: build-linux
        path: NifSkopeCS-*.7z


  build_macos:
    needs: version
    runs-on: macos-latest
    name: Build MacOS
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: 'Install required packages'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.2'

    - name: 'Install clang'
      run: brew install llvm

    - name: 'Build with qmake'
      run: |
        qmake6 QMAKE_APPLE_DEVICE_ARCHS="x86_64" noavx2=1 NifSkope.pro
        make -j 8

    - name: 'Create DMG image'
      run: |
        curl --location -O https://github.com/SarahWeiii/CoACD/releases/download/1.0.7/coacd-1.0.7-cp39-abi3-macosx_11_0_x86_64.whl
        7za x coacd-1.0.7-cp39-abi3-macosx_11_0_x86_64.whl
        curl --location -O https://github.com/fo76utils/NifMopp/releases/download/1.0/NifMopp.zip
        7za x NifMopp.zip
        mkdir release/coacd
        mv coacd/lib_coacd.dylib coacd-1.0.7.dist-info/licenses/LICENSE release/coacd
        mv release/*.xml release/coacd release/shaders release/qt.conf release/style.qss release/*.txt NifMopp.exe release/NifSkopeCS.app/Contents/MacOS/
        macdeployqt release/NifSkopeCS.app -dmg
        mv release/NifSkopeCS.dmg release/NifSkopeCS-${VERSION}-macosqt6_x64.dmg

    - name: 'Upload Artifacts'
      uses: actions/upload-artifact@v6
      with:
        name: build-macos
        path: release/NifSkopeCS-*.dmg


  build_clang64:
    needs: version
    runs-on: windows-latest
    name: Build MSYS2-CLANG64
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - name: 'Checkout'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: 'Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: true
        cache: true
        install: 'base-devel mingw-w64-clang-x86_64-gcc msys/p7zip mingw-w64-clang-x86_64-qt6-base mingw-w64-clang-x86_64-qt6-imageformats mingw-w64-clang-x86_64-qt6-tools msys/wget'

    - name: 'Build with qmake'
      shell: msys2 {0}
      run: |
        qmake6 noavx=1 NifSkope.pro
        make -j 8
        mv -f release/NifSkopeCS.exe release/NifSkopeCS_noavx.exe
        make clean
        qmake6 noavx2=1 NifSkope.pro
        make -j 8
        mv -f release/NifSkopeCS.exe release/NifSkopeCS_noavx2.exe
        make clean
        qmake6 NifSkope.pro
        make -j 8
        wget https://github.com/fo76utils/CoACD/releases/download/1.0.7-20251215/CoACD-20251215-win64.7z
        7za x CoACD-20251215-win64.7z
        wget https://github.com/fo76utils/NifMopp/releases/download/1.0/NifMopp.zip
        7za x NifMopp.zip
        mv -f lib_coacd.dll LICENSE.CoACD NifMopp.exe release
        mv -f release NifSkopeCS
        7za a -m0=lzma -mx=9 NifSkopeCS-${VERSION}-win64qt6_clang.7z NifSkopeCS

    - name: 'Upload Artifacts'
      uses: actions/upload-artifact@v6
      with:
        name: build-clang64
        path: |
          NifSkopeCS-*.7z


  release:
    needs: [version, build_windows, build_linux, build_macos, build_clang64]
    runs-on: ubuntu-latest
    name: Create draft release
    permissions:
      contents: write

    steps:
    - name: 'Download Artifacts'
      uses: actions/download-artifact@v7
      with:
        path: dist
        merge-multiple: true

    # The body comes before the notes that GitHub generates from the commits and pull requests since the last release
    - name: 'Create Draft Release'
      uses: softprops/action-gh-release@v3
      with:
        name: NifSkopeCS ${{ needs.version.outputs.version }}
        tag_name: ${{ needs.version.outputs.version }}
        target_commitish: ${{ github.sha }}
        body: Based on NifSkope ${{ needs.version.outputs.nifskope_version }}.
        generate_release_notes: true
        draft: true
        fail_on_unmatched_files: true
        files: |
          dist/NifSkopeCS-*.7z
          dist/NifSkopeCS-*.dmg
